name: refresh-data
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  # Restarting the pinger is a workflow dispatch, which needs this scope. Without
  # it the restart step failed silently and a dead pinger stayed dead.
  actions: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The pinger pins its code at checkout, so a fresh hourly run also refreshes it.
      - name: Restart pinger with current code
        if: always()
        run: gh workflow run pinger --repo "$GITHUB_REPOSITORY" || echo "could not restart pinger"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect all sources
        run: node scripts/collect.mjs
      - name: Rotate personal signals
        if: always()
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm i --no-save @vercel/blob > /dev/null 2>&1
          node scripts/assign.mjs || echo "assign failed (store down?) — feed commit continues"
          node scripts/migrate-blobs.mjs || echo "migrate failed — feed commit continues"
          DATA_DIR="$GITHUB_WORKSPACE/.data" node scripts/push-contacts.mjs || echo "push-contacts failed — feed commit continues"
      # The public half of the contacts goes to the orphan `data` branch, which
      # costs nothing to read, rather than to the metered store. The pinger
      # force-pushes that branch every five minutes, so this step must carry its
      # intraday.json forward or the pulse would reset on every hourly run.
      - name: Publish contacts to the data branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA_DIR="$GITHUB_WORKSPACE/.data"
          [ -s "$DATA_DIR/contacts.json" ] || { echo "no contacts artefact — nothing to publish"; exit 0; }

          # The pinger owns intraday.json; this job must carry it forward or the
          # pulse the whole demo rests on resets every hour. Read it over git,
          # not the CDN: raw.githubusercontent caches for about five minutes and
          # ignores query strings, so a "fresh" read can be a stale one.
          git fetch -q --depth 1 origin data 2>/dev/null || true
          git show origin/data:intraday.json > "$DATA_DIR/intraday.json" 2>/dev/null || true

          # This job must never be the one that creates the branch: a branch
          # without a pulse permanently stops the pinger, which refuses to
          # publish over a branch it cannot read.
          if [ ! -s "$DATA_DIR/intraday.json" ]; then
            echo "no pulse to carry forward — not publishing"
            exit 0
          fi
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1]))' "$DATA_DIR/intraday.json" \
            || { echo "the pulse on the branch is not valid JSON — refusing to publish over it"; exit 1; }

          printf '{\n  "git": { "deploymentEnabled": false }\n}\n' > "$DATA_DIR/vercel.json"
          rm -rf "$DATA_DIR/.git"
          git -C "$DATA_DIR" init -q
          # Named, not -A: the project .gitignore does not apply to a repository
          # rooted at $DATA_DIR, so anything that ever lands there is published.
          git -C "$DATA_DIR" add -- contacts.json intraday.json vercel.json
          git -C "$DATA_DIR" -c user.email=actions@github.com -c user.name=right-window-refresh commit -q -m "data $(date -u +%FT%TZ)"
          git -C "$DATA_DIR" push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data \
            || { echo "publishing contacts failed"; exit 1; }
          echo "contacts published: $(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).count)' "$DATA_DIR/contacts.json") rows"
      - name: Commit refreshed data
        if: always()
        run: |
          git config user.email "maxim122090@gmail.com"
          git config user.name "Maxim Perekatov"
          git add src/data/feed.json data/hpd-baseline.json data/mgmt-changes.json data/seen.json data/unresolved-contacts.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh feed"
            for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
            echo "PUSH_PASSES=1" >> "$GITHUB_ENV"
          fi
      - name: Notify Wallet passes
        if: env.PUSH_PASSES == '1'
        env:
          APNS_KEY_P8_B64: ${{ secrets.APNS_KEY_P8_B64 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PASS_TYPE_ID: ${{ secrets.PASS_TYPE_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm i --no-save @vercel/blob > /dev/null 2>&1
          node scripts/push-passes.mjs
