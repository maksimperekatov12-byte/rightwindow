name: refresh-data
# The pinger's loop dispatches this about once an hour (pinger.yml,
# lib/sweep-clock.mjs). GitHub's own schedule stays as the backstop for a
# pinger that is down: it asks hourly and actually starts every two to five
# hours, and when it lands within 45 minutes of another sweep the gate below
# lets it step aside instead of sweeping twice.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  # Restarting the pinger is a workflow dispatch, which needs this scope. Without
  # it the restart step failed silently and a dead pinger stayed dead.
  actions: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  # Only a scheduled run is gated. A dispatch is a decision someone already
  # made — the pinger after its own 55-minute check, the Vercel cron after the
  # same, or the owner by hand — and skips this job.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      sweep: ${{ steps.gate.outputs.sweep }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 3 is "not due". Anything else sweeps: a history GitHub cannot
          # serve is no reason to skip the backstop.
          code=0
          node scripts/sweep-due.mjs 45 || code=$?
          if [ "$code" = 3 ]; then
            echo "another sweep started less than 45 minutes ago — this scheduled run steps aside"
            echo "sweep=0" >> "$GITHUB_OUTPUT"
          else
            echo "sweep=1" >> "$GITHUB_OUTPUT"
          fi

  # Skipped only when the gate said "0". A skipped gate (a dispatch) or one
  # that failed to run leaves the output empty, and the sweep goes ahead. A
  # skipped collect job is also how the pinger and the cron recognise a run
  # that swept nothing (lib/sweep-clock.mjs), so the job keeps its name.
  # always() is what lets a job run after a job it needs was skipped; without it
  # GitHub skips `collect` on every dispatch whatever the rest of the expression
  # says — the first dispatch after this design shipped swept nothing.
  # !cancelled() still stops it when the run is cancelled.
  collect:
    needs: gate
    if: ${{ always() && !cancelled() && needs.gate.outputs.sweep != '0' }}
    runs-on: ubuntu-latest
    steps:
      # main as it is now, not the commit this run was queued at: a run that
      # waited behind another in data-writes would otherwise collect from the
      # tree before that run's commit and lose its own to a rebase conflict.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The pinger pins its code at checkout, so a fresh hourly run also
      # refreshes it. It is told when this sweep began, so the new loop does
      # not dispatch another for 55 minutes.
      - name: Restart pinger with current code
        if: always()
        run: gh workflow run pinger --repo "$GITHUB_REPOSITORY" -f sweep_at="$(date +%s)" || echo "could not restart pinger"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect all sources
        # With a search key present the collector resolves managing agents it
        # has never seen; without one it reads the cache and stops, exactly as
        # it does today. The provider is detected from the key's own format.
        env:
          ENRICH_API_KEY: ${{ secrets.ENRICH_API_KEY }}
          # Optional repository variables: the provider id when the key's shape
          # is ambiguous (serper / serpapi / brave-search), and the day's cap
          # on searches across all runs (lib/enrich.mjs, default 60).
          ENRICH_PROVIDER: ${{ vars.ENRICH_PROVIDER }}
          ENRICH_DAILY_BUDGET: ${{ vars.ENRICH_DAILY_BUDGET }}
          # Without this the shared contact cache never arrives and every run
          # re-resolves companies already known — which spent a whole month of
          # a search plan in a single hour on 2026-09-08.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm i --no-save @vercel/blob > /dev/null 2>&1
          node scripts/collect.mjs
      - name: Rotate personal signals
        if: always()
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm i --no-save @vercel/blob > /dev/null 2>&1
          node scripts/assign.mjs || echo "assign failed (store down?) — feed commit continues"
          node scripts/migrate-blobs.mjs || echo "migrate failed — feed commit continues"
          DATA_DIR="$GITHUB_WORKSPACE/.data" node scripts/push-contacts.mjs || echo "push-contacts failed — feed commit continues"
      # The public half of the contacts goes to the orphan `data` branch, which
      # costs nothing to read, rather than to the metered store. The pinger
      # force-pushes that branch every five minutes, so this step must carry its
      # intraday.json forward or the pulse would reset on every hourly run.
      - name: Publish contacts to the data branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA_DIR="$GITHUB_WORKSPACE/.data"
          [ -s "$DATA_DIR/contacts.json" ] || { echo "no contacts artefact — nothing to publish"; exit 0; }

          # The pinger owns intraday.json; this job must carry it forward or the
          # pulse the whole demo rests on resets every hour. Read it over git,
          # not the CDN: raw.githubusercontent caches for about five minutes and
          # ignores query strings, so a "fresh" read can be a stale one.
          git fetch -q --depth 1 origin data 2>/dev/null || true
          git show origin/data:intraday.json > "$DATA_DIR/intraday.json" 2>/dev/null || true

          # This job must never be the one that creates the branch: a branch
          # without a pulse permanently stops the pinger, which refuses to
          # publish over a branch it cannot read.
          if [ ! -s "$DATA_DIR/intraday.json" ]; then
            echo "no pulse to carry forward — not publishing"
            exit 0
          fi
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1]))' "$DATA_DIR/intraday.json" \
            || { echo "the pulse on the branch is not valid JSON — refusing to publish over it"; exit 1; }

          printf '{\n  "git": { "deploymentEnabled": false }\n}\n' > "$DATA_DIR/vercel.json"
          rm -rf "$DATA_DIR/.git"
          git -C "$DATA_DIR" init -q
          # Named, not -A: the project .gitignore does not apply to a repository
          # rooted at $DATA_DIR, so anything that ever lands there is published.
          git -C "$DATA_DIR" add -- contacts.json intraday.json vercel.json
          git -C "$DATA_DIR" -c user.email=actions@github.com -c user.name=right-window-refresh commit -q -m "data $(date -u +%FT%TZ)"
          git -C "$DATA_DIR" push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data \
            || { echo "publishing contacts failed"; exit 1; }
          echo "contacts published: $(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).count)' "$DATA_DIR/contacts.json") rows"
      - name: Commit refreshed data
        if: always()
        run: |
          git config user.email "maxim122090@gmail.com"
          git config user.name "Maxim Perekatov"
          # data/health.json is the run's report for /status — written whether
          # the collector finished or died, which is why this step runs always.
          git add src/data/feed.json data/hpd-baseline.json data/mgmt-changes.json data/seen.json data/unresolved-contacts.json
          [ -f data/health.json ] && git add data/health.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            if git diff --cached --quiet -- src/data/feed.json; then
              git commit -m "data: run report"
            else
              git commit -m "data: refresh feed"
              echo "PUSH_PASSES=1" >> "$GITHUB_ENV"
            fi
            # A push that never lands must fail the run: the old loop ended
            # green after three failed attempts, with this run's feed and
            # report lost. The abort needs its `|| true` — with no rebase in
            # progress it exits 128, which under bash -e ends the retries.
            ok=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::the data commit was not pushed"; exit 1; }
          fi
      - name: Notify Wallet passes
        if: env.PUSH_PASSES == '1'
        env:
          APNS_KEY_P8_B64: ${{ secrets.APNS_KEY_P8_B64 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PASS_TYPE_ID: ${{ secrets.PASS_TYPE_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm i --no-save @vercel/blob > /dev/null 2>&1
          node scripts/push-passes.mjs
