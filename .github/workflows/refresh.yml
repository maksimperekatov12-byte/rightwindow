name: refresh-data
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The pinger pins its code at checkout, so a fresh hourly run also refreshes it.
      - name: Restart pinger with current code
        if: always()
        run: gh workflow run pinger --repo "$GITHUB_REPOSITORY" || echo "could not restart pinger"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect all sources
        run: node scripts/collect.mjs
      - name: Rotate personal signals
        if: always()
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm i --no-save @vercel/blob > /dev/null 2>&1
          node scripts/assign.mjs || echo "assign failed (store down?) — feed commit continues"
          node scripts/migrate-blobs.mjs || echo "migrate failed — feed commit continues"
          node scripts/push-contacts.mjs || echo "push-contacts failed — feed commit continues" 
      - name: Commit refreshed data
        if: always()
        run: |
          git config user.email "maxim122090@gmail.com"
          git config user.name "Maxim Perekatov"
          git add src/data/feed.json data/hpd-baseline.json data/mgmt-changes.json data/seen.json data/unresolved-contacts.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh feed"
            for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
            echo "PUSH_PASSES=1" >> "$GITHUB_ENV"
          fi
      - name: Notify Wallet passes
        if: env.PUSH_PASSES == '1'
        env:
          APNS_KEY_P8_B64: ${{ secrets.APNS_KEY_P8_B64 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PASS_TYPE_ID: ${{ secrets.PASS_TYPE_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm i --no-save @vercel/blob > /dev/null 2>&1
          node scripts/push-passes.mjs
