name: refresh-data
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/collect.mjs
      - name: Commit refreshed data
        run: |
          git config user.email "maxim122090@gmail.com"
          git config user.name "Maxim Perekatov"
          git add src/data/feed.json data/hpd-baseline.json data/seen.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh feed"
            git push
          fi
