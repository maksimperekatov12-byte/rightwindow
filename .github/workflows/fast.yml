name: fast-refresh
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check intraday sources
        run: node scripts/collect-fast.mjs
      - name: Heartbeat
        if: always()
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm i --no-save @vercel/blob > /dev/null 2>&1
          node scripts/heartbeat.mjs
      - name: Commit if changed
        run: |
          git config user.email "maxim122090@gmail.com"
          git config user.name "Maxim Perekatov"
          git add src/data/feed.json data/seen.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: fast refresh (awards/openings)"
            for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
          fi
