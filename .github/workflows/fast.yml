name: fast-refresh
# Fallback only — the pinger workflow drives the real cadence. Kept for manual runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save @vercel/blob
      - run: node scripts/collect-fast.mjs
      - run: node scripts/heartbeat.mjs
      - run: node scripts/assign.mjs
      - run: node scripts/notify.mjs
