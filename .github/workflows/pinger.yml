name: pinger
# GitHub's cron scheduler is best-effort and was skipping most 10-minute ticks,
# so the cadence is driven from inside a long-running job instead: one run loops
# for ~5.5h at a fixed interval, then the next scheduled run takes over.
# The repo is public, so Actions minutes are free.
#
# The tick publishes to the orphan `data` branch, not to Vercel Blob: one blob
# write per tick is 288 advanced operations a day against a 2,000/month
# allowance, which suspended the store on 2026-08-28. Reads of the data branch
# cost nothing. vercel.json keeps that branch from triggering deployments.
on:
  schedule:
    - cron: '11 */5 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: How long this run should keep pinging (minutes)
        required: false
        default: '330'

permissions:
  contents: write

concurrency:
  group: pinger
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
      INTERVAL_SECONDS: '300'
      DATA_DIR: ${{ github.workspace }}/.data
      # Instant alerts hold a 45-minute per-user cooldown, so checking every
      # sixth tick loses nothing and costs a sixth of the blob reads.
      NOTIFY_EVERY: '6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save @vercel/blob
      - name: Seed the published document
        run: |
          mkdir -p "$DATA_DIR"
          # Losing the seed resets the proof-of-life counter to 1 in front of
          # whoever is looking, so it retries and falls back to git itself.
          for i in 1 2 3; do
            curl -sfL --max-time 20 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/intraday.json?r=$i" \
              -o "$DATA_DIR/intraday.json" && break
            sleep 5
          done
          if [ ! -s "$DATA_DIR/intraday.json" ]; then
            git fetch -q --depth 1 origin data 2>/dev/null \
              && git show origin/data:intraday.json > "$DATA_DIR/intraday.json" 2>/dev/null \
              && echo "seeded from git" || true
          fi
          # contacts.json is written by the hourly refresh, not by this job, but
          # this job force-pushes the whole branch every five minutes. Without
          # carrying it forward, every publish of contacts would survive about
          # one tick.
          #
          # Read over git, not over raw.githubusercontent: that CDN has a ~5
          # minute TTL and ignores query strings (this repo measured it — see
          # lib/live-source.mjs), which is precisely the tick interval, so a
          # cached copy would keep resurrecting a contacts file that had just
          # been replaced or deliberately removed.
          git fetch -q --depth 1 origin data 2>/dev/null || true
          git show origin/data:contacts.json > "$DATA_DIR/contacts.json" 2>/dev/null \
            || { rm -f "$DATA_DIR/contacts.json"; echo "no contacts on the branch yet"; }
          if [ ! -s "$DATA_DIR/intraday.json" ]; then
            # Distinguish "no branch yet" from "could not reach GitHub". Publishing
            # on a blip would force-push a reset pulse and an empty change log over
            # the real history — the proof-of-life the demo rests on.
            git ls-remote --exit-code --heads origin data >/dev/null 2>&1
            case $? in
              0) echo "data branch exists but could not be read — refusing to publish over it"; exit 1 ;;
              2) echo "no data branch yet — first run" ;;
              *) echo "cannot tell whether the data branch exists — refusing to publish"; exit 1 ;;
            esac
          else
            echo "seeded from data branch"
          fi
          git config --global user.email "actions@github.com"
          git config --global user.name "right-window-pinger"
      - name: Ping loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment, not expanded into the script: a dispatch
          # value containing a quote would otherwise run as shell in this job.
          MINUTES_INPUT: ${{ inputs.minutes }}
        run: |
          MINUTES="${MINUTES_INPUT:-330}"
          case "$MINUTES" in ''|*[!0-9]*) MINUTES=330 ;; esac
          END=$(( $(date +%s) + MINUTES * 60 ))
          TICK=0
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          while [ "$(date +%s)" -lt "$END" ]; do
            TICK=$((TICK + 1))
            echo "--- tick $TICK at $(date -u +%H:%M:%SZ) ---"
            TICK=$TICK node scripts/collect-fast.mjs || echo "collect-fast failed, continuing"

            # Republish: one orphan commit each time, so the branch never grows
            # a history and the repo stays small.
            # Re-read before republishing: the hourly job may have pushed a
            # newer contacts.json since the last tick, and force-pushing a stale
            # copy over it would undo that until the next hour. Over git, so the
            # CDN's five-minute cache cannot resurrect a removed row — a
            # takedown has to be able to take effect within one tick.
            if git fetch -q --depth 1 origin data 2>/dev/null \
               && git show origin/data:contacts.json > "$DATA_DIR/contacts.json.new" 2>/dev/null \
               && node -e 'JSON.parse(require("fs").readFileSync(process.argv[1]))' "$DATA_DIR/contacts.json.new"; then
              mv "$DATA_DIR/contacts.json.new" "$DATA_DIR/contacts.json"
            else
              rm -f "$DATA_DIR/contacts.json.new"
            fi

            if [ -f "$DATA_DIR/intraday.json" ]; then
              # The branch carries its own vercel.json: Vercel reads config from
              # the commit it is asked to build, and this one says do not build.
              printf '{\n  "git": { "deploymentEnabled": false }\n}\n' > "$DATA_DIR/vercel.json"
              rm -rf "$DATA_DIR/.git"
              git -C "$DATA_DIR" init -q
              # Named, not -A: this repo's .gitignore does not apply inside a
              # repository rooted at $DATA_DIR, so anything that ever lands
              # there would be published.
              git -C "$DATA_DIR" add -- intraday.json vercel.json
              [ -s "$DATA_DIR/contacts.json" ] && git -C "$DATA_DIR" add -- contacts.json
              git -C "$DATA_DIR" commit -q -m "data $(date -u +%FT%TZ)"
              git -C "$DATA_DIR" push -q --force "$REMOTE" HEAD:data && echo "published" || echo "publish failed, continuing"
            fi

            if [ $((TICK % NOTIFY_EVERY)) -eq 0 ]; then
              node scripts/notify.mjs || echo "notify failed, continuing"
            fi

            REMAIN=$(( END - $(date +%s) ))
            [ "$REMAIN" -le "$INTERVAL_SECONDS" ] && break
            sleep "$INTERVAL_SECONDS"
          done
          echo "loop finished after $TICK ticks"
